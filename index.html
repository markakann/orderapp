<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>點餐系統</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>* { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: 'PingFang TC', 'Noto Sans TC', sans-serif; } input[type=number]::-webkit-inner-spin-button { opacity: 1; }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const SWEETNESS = {
  1: ["正常糖","少糖","半糖","微糖","二分糖","一分糖","無糖"],
  2: ["正常糖","少糖","半糖","微糖","一分糖","無糖"],
  3: ["正常糖","少糖","半糖","微糖","無糖"],
  4: ["正常糖","少糖","半糖","微糖","一分糖"],
  5: ["正常糖","微糖","無糖"],
  6: ["冬瓜甜","減糖加茶","減糖加水"],
  7: ["固定甜"],
};
const ICE = {
  A: ["正常冰","少冰","微冰","去冰","常溫","溫","熱"],
  B: ["正常冰","少冰","微冰","去冰"],
  C: ["固定冰量"],
};
const WARM_INCOMPATIBLE = ["墨玉","春梅凍","蕎麥凍"];
const WARM_ICE = ["溫","熱"];
const ICE_FOR_WARM_RULE = ["去冰","常溫","溫","熱"];
const BASE_TOPPINGS = [
  { name:"白玉", price:10 },
  { name:"水玉", price:10 },
  { name:"墨玉", price:15 },
  { name:"春梅凍", price:15 },
  { name:"蕎麥凍", price:15 },
];
const MENU = {
  紅茶:{ items:[
    { name:"熟成紅茶", price:50, sugar:1, ice:"A" },
    { name:"麗春紅茶", price:50, sugar:1, ice:"A" },
    { name:"胭脂紅茶", price:60, sugar:1, ice:"A" },
    { name:"胭脂多多", price:70, sugar:2, ice:"B" },
    { name:"金蜜熟成", price:73, sugar:5, ice:"A" },
  ]},
  紅茶2:{ items:[
    { name:"太妃熟成", price:65, sugar:2, ice:"A", extraOption:{ name:"特濃", price:10 } },
    { name:"雪藏紅茶", price:70, sugar:2, ice:"B", toppingLimit:1 },
  ]},
  綠茶:{ items:[
    { name:"春芽綠茶", price:50, sugar:1, ice:"A" },
  ]},
  冷露:{ items:[
    { name:"熟成冷露", price:55, sugar:3, ice:"A" },
    { name:"春芽冷露", price:55, sugar:3, ice:"A", specialSugar:"yifen" },
    { name:"雪花冷露", price:50, sugar:6, ice:"A" },
    { name:"春梅冰茶", price:70, sugar:6, ice:"A" },
    { name:"胭脂冷露", price:60, sugar:3, ice:"A" },
  ]},
  歐蕾:{ items:[
    { name:"熟成歐蕾", price:75, sugar:1, ice:"A", excludedToppings:["白玉"] },
    { name:"白玉歐蕾", price:80, sugar:1, ice:"A", lockedTopping:{ name:"白玉", price:10 } },
    { name:"冷露歐蕾", price:75, sugar:6, ice:"A" },
    { name:"金蜜歐蕾", price:80, sugar:5, ice:"A" },
    { name:"胭脂歐蕾", price:79, sugar:1, ice:"A" },
  ]},
  歐蕾2:{ items:[
    { name:"鴛鴦歐蕾", price:80, sugar:2, ice:"A", excludedToppings:["墨玉"] },
    { name:"墨玉鴛鴦歐蕾", price:90, sugar:2, ice:"A", lockedTopping:{ name:"墨玉", price:15 } },
    { name:"熟成榛果歐蕾", price:80, sugar:2, ice:"A" },
  ]},
  檸檬:{ items:[
    { name:"熟檸紅茶", price:65, sugar:2, ice:"A" },
    { name:"春檸綠茶", price:65, sugar:2, ice:"A" },
    { name:"檸檬冷露", price:70, sugar:6, ice:"A" },
    { name:"金蜜檸檬", price:73, sugar:3, ice:"A" },
  ]},
  奶茶:{ items:[
    { name:"熟成奶茶", price:65, sugar:2, ice:"A", excludedToppings:["白玉"] },
    { name:"春芽奶茶", price:65, sugar:2, ice:"A" },
    { name:"胭脂奶茶", price:70, sugar:2, ice:"A" },
    { name:"白玉奶茶", price:70, sugar:2, ice:"A", lockedTopping:{ name:"白玉", price:10 } },
    { name:"雪藏奶茶", price:79, sugar:2, ice:"B", toppingLimit:1 },
  ]},
  烏龍:{ items:[
    { name:"半熟烏龍", price:50, sugar:2, ice:"A" },
    { name:"半熟烏龍冷露", price:55, sugar:3, ice:"A" },
    { name:"半熟烏龍厚乳", price:79, sugar:2, ice:"A" },
    { name:"半熟烏龍歐蕾", price:79, sugar:2, ice:"A" },
  ]},
  穀奈:{ items:[
    { name:"輕纖穀奈茶", price:60, sugar:2, ice:"A" },
    { name:"穀奈冷露", price:60, sugar:3, ice:"A" },
    { name:"穀奈歐蕾", price:79, sugar:2, ice:"A" },
  ]},
  烏龍2:{ items:[
    { name:"茶花輕焙烏龍", price:60, sugar:2, ice:"A" },
    { name:"茶花烏龍多多", price:70, sugar:2, ice:"B" },
    { name:"茶花烏龍梅", price:70, sugar:2, ice:"A" },
    { name:"茶花烏龍厚乳", price:79, sugar:2, ice:"A" },
    { name:"生茶烏龍厚乳", price:89, sugar:2, ice:"A" },
  ]},
  蘋果:{ items:[
    { name:"蘋果春芽", price:79, sugar:4, ice:"B" },
    { name:"蘋果麗春", price:79, sugar:4, ice:"B" },
    { name:"蘋果茶花烏龍", price:85, sugar:4, ice:"B" },
    { name:"蘋果春芽厚乳", price:79, sugar:4, ice:"B" },
  ]},
  馥莓:{ items:[
    { name:"馥莓冰茶", price:55, sugar:4, ice:"A" },
    { name:"紫蘇馥莓熟成", price:85, sugar:2, ice:"B", lockedTopping:{ name:"水玉", price:10 } },
    { name:"紫蘇馥莓冰茶", price:85, sugar:2, ice:"B" },
    { name:"生茶白玉冰淇淋", price:69, noCustomize:true, pairPrice:109 },
  ]},
  聯名:{ items:[
    { name:"柚檸紅茶", price:75, sugar:7, ice:"C", fixedSugar:true, fixedIce:true },
  ]},
  折扣:{ items:[
    { name:"員工折5元", price:0, discount:{ type:"per_cup", amount:5 }, noCustomize:true },
    { name:"8折", price:0, discount:{ type:"ratio", ratio:0.8 }, noCustomize:true },
    { name:"9折", price:0, discount:{ type:"ratio", ratio:0.9 }, noCustomize:true },
  ]},
  袋子:{ items:[
    { name:"1元袋", price:1, noCustomize:true },
    { name:"2元袋", price:2, noCustomize:true },
  ]},
};

const defaultConfig = () => ({ sugar:null, ice:null, toppings:[], doubleTopping:false, extraOption:false });

function OrderApp() {
  const [mode, setMode] = useState("browse");
  const [selectedCategory, setSelectedCategory] = useState(null);
  const [pendingItem, setPendingItem] = useState(null);
  const [pendingConfig, setPendingConfig] = useState(defaultConfig());
  const [pendingQty, setPendingQty] = useState(1);
  const [orders, setOrders] = useState([]);
  const [editingId, setEditingId] = useState(null);
  const [selectedOrderId, setSelectedOrderId] = useState(null);
  const [phone, setPhone] = useState("");
  const [showSummary, setShowSummary] = useState(false);
  const [showClearConfirm, setShowClearConfirm] = useState(false);
  const [receipt, setReceipt] = useState(null);
  const [discount, setDiscount] = useState(null); // { type, amount/ratio, name }

  const calcOrderAmount = (o, forceOriginalPrice=false) => {
    if (o.pairPrice && !forceOriginalPrice) {
      const pairs = Math.floor(o.qty/2);
      const singles = o.qty%2;
      return pairs*o.pairPrice + singles*o.unitTotal;
    }
    return o.unitTotal*o.qty;
  };
  const calcDiscountAmount = () => {
    if (!discount) return 0;
    const drinkOrders = orders.filter(o => o.category !== "袋子" && o.category !== "折扣");
    if (discount.type === "per_cup") {
      // 每杯-5元
      // 一般飲品：每杯折5
      const normalCups = drinkOrders.filter(o => !o.pairPrice).reduce((s,o) => s+o.qty, 0);
      // 生茶白玉冰淇淋：只有單杯（奇數剩餘的那杯）才折5，湊對的109不折
      const iceCreamOrders = drinkOrders.filter(o => o.pairPrice);
      const iceCreamSingleCups = iceCreamOrders.reduce((s,o) => s+(o.qty%2), 0);
      return discount.amount * (normalCups + iceCreamSingleCups);
    }
    if (discount.type === "ratio") {
      // 全單折，生茶白玉冰淇淋取消湊對，全部以原價69計算再折
      const subtotal = drinkOrders.reduce((s,o) => s + o.unitTotal*o.qty, 0);
      return Math.round(subtotal * (1 - discount.ratio));
    }
    return 0;
  };
  // 折扣明細（用於顯示）
  const discountDetail = () => {
    if (!discount) return null;
    const drinkOrders = orders.filter(o => o.category !== "袋子" && o.category !== "折扣");
    if (discount.type === "per_cup") {
      const normalCups = drinkOrders.filter(o => !o.pairPrice).reduce((s,o) => s+o.qty, 0);
      const iceCreamSingleCups = drinkOrders.filter(o => o.pairPrice).reduce((s,o) => s+(o.qty%2), 0);
      const totalDiscountCups = normalCups + iceCreamSingleCups;
      return `${discount.name}（${totalDiscountCups} 杯 × 5元）`;
    }
    if (discount.type === "ratio") {
      return `${discount.name}（全單折扣）`;
    }
    return discount.name;
  };
  const bagTotal = orders.filter(o=>o.category==="袋子").reduce((s,o)=>s+calcOrderAmount(o),0);
  // ratio折扣時，冰淇淋取消湊對（全部原價）；per_cup時，冰淇淋維持湊對
  const subtotalNoBag = orders.filter(o=>o.category!=="袋子").reduce((s,o)=>{
    if (o.pairPrice && discount?.type==="ratio") return s + o.unitTotal*o.qty;
    return s + calcOrderAmount(o);
  },0);
  const discountAmount = calcDiscountAmount();
  const total = subtotalNoBag - discountAmount + bagTotal;
  const totalCups = orders.reduce((s,o) => s+(o.category==="袋子"?0:o.qty), 0);
  const totalBags = orders.filter(o=>o.category==="袋子").reduce((s,o)=>s+o.qty,0);

  const doubleTargetTopping = (item,cfg) => cfg.toppings.length===1 ? cfg.toppings[0] : null;
  const canDouble = (item,cfg) => { const l=item.toppingLimit||2; return l>=2 && cfg.toppings.length===1; };
  const calcUnitTotal = (item,cfg) => {
    const toppingSum = cfg.toppings.filter(t=>t.name!==item.lockedTopping?.name).reduce((s,t)=>s+t.price,0);
    const dtt = doubleTargetTopping(item,cfg);
    const doubleExtra = cfg.doubleTopping&&dtt ? dtt.price : 0;
    const extra = item.extraOption&&cfg.extraOption ? item.extraOption.price : 0;
    return item.price+toppingSum+doubleExtra+extra;
  };
  const getSugarOptions = (item,cfg) => {
    const base = [...SWEETNESS[item.sugar]];
    if (item.specialSugar==="yifen") {
      const iceQ = cfg.ice&&ICE_FOR_WARM_RULE.includes(cfg.ice);
      const noTop = cfg.toppings.length===0;
      if (iceQ&&noTop&&!base.includes("一分糖")) base.push("一分糖");
    }
    return base;
  };
  const handleToggleTopping = (t,item,cfg,setCfg) => {
    const limit = item.toppingLimit||2;
    const exists = cfg.toppings.find(x=>x.name===t.name);
    if (exists) {
      if (item.lockedTopping&&item.lockedTopping.name===t.name) return;
      setCfg(p=>({...p,toppings:p.toppings.filter(x=>x.name!==t.name),doubleTopping:false}));
      return;
    }
    setCfg(p=>{
      let next=[...p.toppings,t];
      if (next.length>limit) {
        const locked=item.lockedTopping?next.filter(x=>x.name===item.lockedTopping.name):[];
        const manual=next.filter(x=>x.name!==item.lockedTopping?.name);
        next=[...locked,...manual.slice(manual.length-(limit-locked.length))];
      }
      let newIce=p.ice;
      if (WARM_INCOMPATIBLE.includes(t.name)&&WARM_ICE.includes(p.ice)) newIce="正常冰";
      const newDouble=next.length===1?p.doubleTopping:false;
      return {...p,toppings:next,ice:newIce,doubleTopping:newDouble};
    });
  };
  const isIceDisabled = (ic,cfg,item) => {
    if (item?.fixedIce) return true;
    return cfg.toppings.some(t=>WARM_INCOMPATIBLE.includes(t.name))&&WARM_ICE.includes(ic);
  };
  const isSugarDisabled = (sw,item,cfg) => {
    if (item?.fixedSugar) return true;
    if (item.specialSugar==="yifen"&&sw==="一分糖") {
      const iceQ=cfg.ice&&ICE_FOR_WARM_RULE.includes(cfg.ice);
      const noTop=cfg.toppings.length===0;
      return !(iceQ&&noTop);
    }
    return false;
  };
  const handleSelectItem = (item,category) => {
    if (item.noCustomize) {
      // 折扣品項：切換選擇
      if (item.discount) {
        setDiscount(d => d && d.name === item.name ? null : { ...item.discount, name: item.name });
        return;
      }
      const existing=orders.find(o=>o.item===item.name);
      if (existing) {
        setOrders(p=>p.map(o=>o.id===existing.id?{...o,qty:o.qty+1}:o));
        setSelectedOrderId(existing.id);
      } else {
        const id=Date.now();
        setOrders(p=>[...p,{id,category,item:item.name,basePrice:item.price,unitTotal:item.price,pairPrice:item.pairPrice,sugar:null,ice:null,toppings:[],doubleTopping:false,extraOption:false,qty:1,itemRef:{...item,category}}]);
        setSelectedOrderId(id);
      }
      return;
    }
    const cfg=defaultConfig();
    cfg.sugar=SWEETNESS[item.sugar][0];
    cfg.ice=ICE[item.ice][0];
    if (item.lockedTopping) cfg.toppings=[item.lockedTopping];
    setPendingItem({...item,category});
    setPendingConfig(cfg);
    setPendingQty(1);
    setMode("customize_new");
    setEditingId(null);
    setSelectedOrderId(null);
  };
  const handleAddOrder = () => {
    const id=Date.now();
    const unitTotal=calcUnitTotal(pendingItem,pendingConfig);
    setOrders(p=>[...p,{id,category:pendingItem.category,item:pendingItem.name,basePrice:pendingItem.price,sugar:pendingConfig.sugar,ice:pendingConfig.ice,toppings:[...pendingConfig.toppings],doubleTopping:pendingConfig.doubleTopping,extraOption:pendingConfig.extraOption,unitTotal,qty:pendingQty,itemRef:pendingItem}]);
    setSelectedOrderId(id);
    setMode("browse");
    setPendingItem(null);
    setPendingConfig(defaultConfig());
    setPendingQty(1);
  };
  const handleClickOrderToEdit = (order) => {
    if (order.itemRef?.noCustomize) {
      setSelectedOrderId(selectedOrderId === order.id ? null : order.id);
      return;
    }
    if (selectedOrderId===order.id&&mode==="customize_edit") { setSelectedOrderId(null); setMode("browse"); return; }
    setSelectedOrderId(order.id); setEditingId(order.id);
    setPendingItem({...order.itemRef,category:order.category});
    setPendingConfig({sugar:order.sugar,ice:order.ice,toppings:[...order.toppings],doubleTopping:order.doubleTopping||false,extraOption:order.extraOption});
    setPendingQty(order.qty);
    setMode("customize_edit");
  };
  const handleSaveEdit = () => {
    const unitTotal=calcUnitTotal(pendingItem,pendingConfig);
    setOrders(p=>p.map(o=>o.id===editingId?{...o,sugar:pendingConfig.sugar,ice:pendingConfig.ice,toppings:[...pendingConfig.toppings],doubleTopping:pendingConfig.doubleTopping,extraOption:pendingConfig.extraOption,unitTotal,qty:pendingQty}:o));
    setMode("browse"); setEditingId(null); setPendingItem(null); setPendingConfig(defaultConfig()); setPendingQty(1);
  };
  const handleCancelEdit = () => { setMode("browse"); setEditingId(null); setPendingItem(null); setPendingConfig(defaultConfig()); setPendingQty(1); setSelectedOrderId(null); };
  const removeOrder = (id) => {
    setOrders(p=>p.filter(o=>o.id!==id));
    if (editingId===id) handleCancelEdit();
    if (selectedOrderId===id) setSelectedOrderId(null);
  };
  const changeQty = (id,delta) => {
    setOrders(p=>p.flatMap(o=>{
      if (o.id!==id) return [o];
      const nq=o.qty+delta;
      if (nq<=0) { if(editingId===id) handleCancelEdit(); return []; }
      return [{...o,qty:nq}];
    }));
  };
  const clearAll = () => { setOrders([]); setPhone(""); setMode("browse"); setEditingId(null); setPendingItem(null); setPendingConfig(defaultConfig()); setPendingQty(1); setSelectedOrderId(null); setShowClearConfirm(false); setDiscount(null); };

  const isCustomizing = mode==="customize_new"||mode==="customize_edit";
  const pendingUnitTotal = pendingItem?calcUnitTotal(pendingItem,pendingConfig):0;
  const sugarOptions = pendingItem?getSugarOptions(pendingItem,pendingConfig):[];
  const iceOptions = pendingItem?ICE[pendingItem.ice]:[];
  const toppingLimit = pendingItem?.toppingLimit||2;

  const C = { bg:"#F7F4EF",surface:"#FFF",border:"#E2DDD6",accent:"#3D6B4F",accentLight:"#E8F2EC",accentText:"#2A4D38",text:"#1A1A1A",muted:"#8A8078",selected:"#D4EAD9",selectedBorder:"#3D6B4F",danger:"#B83232",dangerLight:"#FDEAEA",disabled:"#D0CBC4",disabledText:"#B0AAA4" };
  const pill = (active,disabled) => ({ padding:"7px 14px",borderRadius:20,cursor:disabled?"not-allowed":"pointer",fontSize:13,fontWeight:600,border:`1.5px solid ${disabled?C.disabled:active?C.accent:C.border}`,background:disabled?"#F0EDE9":active?C.accent:C.surface,color:disabled?C.disabledText:active?"#fff":C.text,opacity:disabled?0.6:1 });
  const chip = (active) => ({ display:"flex",flexDirection:"column",alignItems:"center",padding:"9px 6px",borderRadius:10,cursor:"pointer",fontSize:13,fontWeight:600,gap:2,border:`1.5px solid ${active?C.accent:C.border}`,background:active?C.accentLight:C.surface,color:active?C.accentText:C.text });

  const orderSummaryLine = (o) => {
    if (o.itemRef?.noCustomize) return o.pairPrice&&o.qty>=2?`兩個 NT$${o.pairPrice}`:"";
    const parts=[o.ice,o.sugar];
    const extraToppings=o.toppings.filter(t=>t.name!==o.itemRef?.lockedTopping?.name);
    if (o.doubleTopping) {
      const dtt=extraToppings.length===1?extraToppings[0]:o.itemRef?.lockedTopping;
      if (dtt) parts.push("＋"+dtt.name+" ×2");
    } else if (extraToppings.length>0) {
      parts.push("＋"+extraToppings.map(t=>t.name).join("、"));
    }
    if (o.extraOption&&o.itemRef?.extraOption) parts.push(o.itemRef.extraOption.name);
    return parts.join("・");
  };

  const receiptSummaryLine = (o) => {
    if (o.itemRef?.noCustomize) return o.pairPrice&&o.qty>=2?`兩個 NT$${o.pairPrice}`:"";
    const parts=[o.ice,o.sugar];
    const extraToppings=o.toppings.filter(t=>t.name!==o.itemRef?.lockedTopping?.name);
    if (o.doubleTopping) {
      const dtt=extraToppings.length===1?extraToppings[0]:o.itemRef?.lockedTopping;
      if (dtt) parts.push("＋"+dtt.name+" ×2");
    } else if (extraToppings.length>0) {
      parts.push("＋"+extraToppings.map(t=>t.name).join("、"));
    }
    if (o.extraOption&&o.itemRef?.extraOption) parts.push(o.itemRef.extraOption.name);
    return parts.join("・");
  };

  return (
    <div style={{ height:"100vh",display:"flex",flexDirection:"column",fontFamily:"'PingFang TC','Noto Sans TC',sans-serif",color:C.text,background:C.bg,overflow:"hidden" }}>
      <div style={{ background:C.accent,color:"#fff",padding:"12px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0 }}>
        <span style={{ fontSize:17,fontWeight:700,letterSpacing:2 }}>🧃 點餐系統</span>
        <div style={{ textAlign:"right" }}>
          <div style={{ fontSize:10,opacity:0.75,letterSpacing:1 }}>目前金額</div>
          <div style={{ fontSize:20,fontWeight:700 }}>NT$ {total}</div>
        </div>
      </div>
      <div style={{ display:"flex",flex:1,minHeight:0 }}>
        {/* LEFT */}
        <div style={{ flex:1.5,display:"flex",flexDirection:"column",borderRight:`1px solid ${C.border}` }}>
          {!isCustomizing && (<>
            <div style={{ display:"flex",borderBottom:`1px solid ${C.border}`,background:C.surface,flexShrink:0,flexWrap:"wrap" }}>
              {Object.keys(MENU).map(cat=>(
                <button key={cat} onClick={()=>setSelectedCategory(cat)}
                  style={{ padding:"10px 14px",background:"transparent",border:"none",borderBottom:selectedCategory===cat?`2.5px solid ${C.accent}`:"2.5px solid transparent",cursor:"pointer",fontSize:13,fontWeight:700,color:selectedCategory===cat?C.accent:C.muted,whiteSpace:"nowrap" }}>
                  {cat}
                </button>
              ))}
            </div>
            <div style={{ flex:1,padding:"16px 18px",overflowY:"auto" }}>
              {!selectedCategory&&<div style={{ color:C.muted,textAlign:"center",paddingTop:50,fontSize:13 }}>↑ 請先選擇上方類別</div>}
              {selectedCategory&&MENU[selectedCategory].items.length===0&&<div style={{ color:C.muted,textAlign:"center",paddingTop:50,fontSize:13 }}>品項建置中</div>}
              {selectedCategory&&MENU[selectedCategory].items.length>0&&(
                <div style={{ display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(130px, 1fr))",gap:9 }}>
                  {MENU[selectedCategory].items.map(item=>(
                    <button key={item.name} onClick={()=>handleSelectItem(item,selectedCategory)}
                      style={{ display:"flex",flexDirection:"column",alignItems:"flex-start",padding:"12px 13px",background:item.discount&&discount?.name===item.name?C.accentLight:C.surface,border:`1.5px solid ${item.discount&&discount?.name===item.name?C.accent:C.border}`,borderRadius:10,cursor:"pointer",textAlign:"left",gap:5 }}>
                      <span style={{ fontSize:13,fontWeight:700,color:item.discount&&discount?.name===item.name?C.accentText:C.text }}>{item.name}</span>
                      {!item.discount&&<span style={{ fontSize:12,color:C.accentText,fontWeight:600 }}>NT$ {item.price}</span>}
                    </button>
                  ))}
                </div>
              )}
            </div>
          </>)}

          {isCustomizing&&pendingItem&&(
            <div style={{ flex:1,padding:"16px 18px",overflowY:"auto",display:"flex",flexDirection:"column",gap:16 }}>
              <div style={{ display:"flex",justifyContent:"space-between",alignItems:"flex-start" }}>
                <div>
                  <div style={{ fontSize:11,color:C.muted,fontWeight:700,letterSpacing:1,marginBottom:3 }}>{mode==="customize_edit"?"✏️ 修改品項":"➕ 新增品項"}</div>
                  <div style={{ fontSize:18,fontWeight:700,color:C.accentText }}>{pendingItem.name}</div>
                </div>
                <button onClick={handleCancelEdit} style={{ padding:"6px 12px",background:"transparent",border:`1px solid ${C.border}`,borderRadius:8,cursor:"pointer",fontSize:12,color:C.muted }}>取消</button>
              </div>
              {/* 冰塊 */}
              <div>
                <div style={{ fontSize:11,fontWeight:700,color:C.muted,letterSpacing:1,marginBottom:7 }}>冰塊</div>
                <div style={{ display:"flex",flexWrap:"wrap",gap:7 }}>
                  {iceOptions.map(ic=>{
                    const disabled=isIceDisabled(ic,pendingConfig,pendingItem);
                    const active=pendingConfig.ice===ic;
                    return <button key={ic} style={pill(active,disabled)} disabled={disabled} onClick={()=>{ if(disabled)return; setPendingConfig(p=>{ let ns=p.sugar; if(pendingItem.specialSugar==="yifen"&&p.sugar==="一分糖"){const iq=ICE_FOR_WARM_RULE.includes(ic);const nt=p.toppings.length===0;if(!(iq&&nt))ns=SWEETNESS[pendingItem.sugar][0];} return {...p,ice:ic,sugar:ns}; }); }}>{ic}</button>;
                  })}
                </div>
              </div>
              {/* 甜度 */}
              <div>
                <div style={{ fontSize:11,fontWeight:700,color:C.muted,letterSpacing:1,marginBottom:7 }}>甜度</div>
                <div style={{ display:"flex",flexWrap:"wrap",gap:7 }}>
                  {sugarOptions.map(sw=>{
                    const disabled=isSugarDisabled(sw,pendingItem,pendingConfig);
                    const active=pendingConfig.sugar===sw;
                    return <button key={sw} style={pill(active,disabled)} disabled={disabled} onClick={()=>!disabled&&setPendingConfig(p=>({...p,sugar:sw}))}>{sw}</button>;
                  })}
                </div>
              </div>
              {/* 加料 */}
              <div>
                <div style={{ fontSize:11,fontWeight:700,color:C.muted,letterSpacing:1,marginBottom:7 }}>加料（上限 {toppingLimit} 種）</div>
                <div style={{ display:"grid",gridTemplateColumns:"repeat(3, 1fr)",gap:7 }}>
                  {BASE_TOPPINGS.filter(t=>{ const locked=pendingItem.lockedTopping?.name===t.name; if(locked)return true; return !(pendingItem.excludedToppings||[]).includes(t.name); }).map(t=>{
                    const sel=!!pendingConfig.toppings.find(x=>x.name===t.name);
                    const locked=pendingItem.lockedTopping?.name===t.name;
                    return (
                      <button key={t.name} style={{ ...chip(sel),cursor:locked?"default":"pointer",border:locked?`1.5px solid ${C.accent}`:undefined }} onClick={()=>!locked&&handleToggleTopping(t,pendingItem,pendingConfig,setPendingConfig)}>
                        <span>{t.name}</span>
                        <span style={{ fontSize:11,color:locked?C.accentText:C.muted }}>{locked?"內含":`+${t.price}`}</span>
                      </button>
                    );
                  })}
                  {(()=>{ const able=canDouble(pendingItem,pendingConfig); const dtt=doubleTargetTopping(pendingItem,pendingConfig); const sel=pendingConfig.doubleTopping&&able; return (
                    <button style={{ ...chip(sel),opacity:able?1:0.4,cursor:able?"pointer":"not-allowed",border:`1.5px ${sel?"solid":"dashed"} ${sel?C.accent:C.border}` }} onClick={()=>{ if(able)setPendingConfig(p=>({...p,doubleTopping:!p.doubleTopping})); }}>
                      <span>2份</span>
                      <span style={{ fontSize:11,color:C.muted }}>{dtt?`+${dtt.price}`:"—"}</span>
                    </button>
                  ); })()}
                  {pendingItem.extraOption&&(()=>{ const sel=pendingConfig.extraOption; return (
                    <button style={{ ...chip(sel),borderStyle:"dashed" }} onClick={()=>setPendingConfig(p=>({...p,extraOption:!p.extraOption}))}>
                      <span>{pendingItem.extraOption.name}</span>
                      <span style={{ fontSize:11,color:C.muted }}>+{pendingItem.extraOption.price}</span>
                    </button>
                  ); })()}
                </div>
              </div>
              {/* 數量 */}
              <div style={{ borderTop:`1px solid ${C.border}`,paddingTop:12 }}>
                <div style={{ fontSize:11,fontWeight:700,color:C.muted,letterSpacing:1,marginBottom:8 }}>數量</div>
                <div style={{ display:"flex",alignItems:"center",gap:10 }}>
                  <button onClick={()=>setPendingQty(q=>Math.max(1,q-1))} style={{ width:34,height:34,borderRadius:"50%",background:C.surface,border:`1.5px solid ${C.border}`,cursor:"pointer",fontSize:18,color:C.accentText,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center" }}>−</button>
                  <input type="number" min="1" value={pendingQty} onChange={e=>{ const v=parseInt(e.target.value); if(!isNaN(v)&&v>=1)setPendingQty(v); }} onFocus={e=>e.target.select()} style={{ width:52,textAlign:"center",fontSize:16,fontWeight:700,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"6px 0",outline:"none",color:C.text }} />
                  <button onClick={()=>setPendingQty(q=>q+1)} style={{ width:34,height:34,borderRadius:"50%",background:C.surface,border:`1.5px solid ${C.border}`,cursor:"pointer",fontSize:18,color:C.accentText,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center" }}>＋</button>
                </div>
              </div>
              {/* Footer */}
              <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",borderTop:`1px solid ${C.border}`,paddingTop:14,marginTop:"auto" }}>
                <div>
                  <div style={{ fontSize:11,color:C.muted }}>單杯小計</div>
                  <div style={{ fontSize:21,fontWeight:700,color:C.accentText }}>NT$ {pendingUnitTotal}</div>
                </div>
                {mode==="customize_new"
                  ? <button onClick={handleAddOrder} style={{ padding:"11px 24px",background:C.accent,color:"#fff",border:"none",borderRadius:10,cursor:"pointer",fontSize:14,fontWeight:700 }}>加入點單</button>
                  : <button onClick={handleSaveEdit} style={{ padding:"11px 24px",background:"#2563EB",color:"#fff",border:"none",borderRadius:10,cursor:"pointer",fontSize:14,fontWeight:700 }}>儲存修改</button>
                }
              </div>
            </div>
          )}
        </div>

        {/* RIGHT */}
        <div style={{ flex:1,display:"flex",flexDirection:"column",background:C.surface,minWidth:0 }}>
          <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 13px",borderBottom:`1px solid ${C.border}`,flexShrink:0 }}>
            <span style={{ fontWeight:700,fontSize:14,color:C.accentText }}>點單明細</span>
            <div style={{ display:"flex",alignItems:"center",gap:7 }}>
              <span style={{ background:C.accentLight,color:C.accentText,borderRadius:12,padding:"2px 9px",fontSize:12,fontWeight:700 }}>{totalCups} 杯{totalBags>0?` · ${totalBags} 袋`:""}</span>
              {orders.length>0&&<button onClick={()=>setShowClearConfirm(true)} style={{ padding:"3px 9px",background:C.dangerLight,color:C.danger,border:`1px solid #EFC0C0`,borderRadius:7,cursor:"pointer",fontSize:12,fontWeight:700 }}>🗑 清空</button>}
            </div>
          </div>
          {orders.length===0&&<div style={{ color:C.muted,textAlign:"center",padding:"40px 14px",fontSize:13 }}>點選左側品項開始點餐</div>}
          <div style={{ flex:1,overflowY:"auto",padding:"7px 9px",display:"flex",flexDirection:"column",gap:5 }}>
            {orders.map((o,i)=>{
              const isSel=selectedOrderId===o.id;
              return (
                <div key={o.id} onClick={()=>handleClickOrderToEdit(o)}
                  style={{ padding:"9px 10px",border:`1.5px solid ${isSel?C.selectedBorder:C.border}`,borderRadius:10,cursor:o.itemRef?.noCustomize?"default":"pointer",background:isSel?C.selected:C.bg }}>
                  <div style={{ display:"flex",alignItems:"flex-start",gap:7 }}>
                    <span style={{ background:isSel?C.accent:C.muted,color:"#fff",borderRadius:"50%",width:20,height:20,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0,marginTop:1 }}>{i+1}</span>
                    <div style={{ flex:1,minWidth:0 }}>
                      <div style={{ fontWeight:700,fontSize:13 }}>{o.item}</div>
                      <div style={{ fontSize:11,color:C.muted,marginTop:2 }}>{orderSummaryLine(o)}</div>
                      {isSel&&!o.itemRef?.noCustomize&&<div style={{ fontSize:11,color:C.accent,marginTop:3,fontWeight:600 }}>← 點左側可修改內容</div>}
                      {isSel&&o.itemRef?.noCustomize&&(
                        <div onClick={e=>e.stopPropagation()} style={{ marginTop:6 }}>
                          <button onClick={()=>{ const v=prompt("請輸入數量",o.qty); const n=parseInt(v); if(!isNaN(n)&&n>=1) setOrders(p=>p.map(x=>x.id===o.id?{...x,qty:n}:x)); else if(!isNaN(n)&&n<=0) removeOrder(o.id); }}
                            style={{ padding:"5px 12px",background:C.accentLight,color:C.accentText,border:`1.5px solid ${C.accent}`,borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:700 }}>
                            更改數量
                          </button>
                        </div>
                      )}
                    </div>
                    <div style={{ display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3,flexShrink:0 }}>
                      <div onClick={e=>e.stopPropagation()} style={{ display:"flex",alignItems:"center",gap:4,background:isSel?C.accentLight:C.surface,border:`1.5px solid ${isSel?C.accent:C.border}`,borderRadius:20,padding:"2px 5px" }}>
                        <button onClick={()=>changeQty(o.id,-1)} style={{ background:"transparent",border:"none",cursor:"pointer",fontSize:14,color:C.accentText,fontWeight:700,padding:"0 2px" }}>−</button>
                        <span style={{ fontSize:12,fontWeight:700,minWidth:14,textAlign:"center" }}>{o.qty}</span>
                        <button onClick={()=>changeQty(o.id,1)} style={{ background:"transparent",border:"none",cursor:"pointer",fontSize:14,color:C.accentText,fontWeight:700,padding:"0 2px" }}>＋</button>
                      </div>
                      <span style={{ fontWeight:700,fontSize:13,color:C.accentText }}>NT$ {calcOrderAmount(o)}</span>
                      {o.qty>1&&!o.pairPrice&&<span style={{ fontSize:10,color:C.muted }}>單杯 {o.unitTotal}</span>}
                      {o.qty>1&&o.pairPrice&&<span style={{ fontSize:10,color:C.muted }}>兩個 {o.pairPrice}</span>}
                      <button onClick={e=>{ e.stopPropagation(); removeOrder(o.id); }} style={{ background:"transparent",border:"none",color:C.muted,cursor:"pointer",fontSize:11,padding:0 }}>✕</button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          {orders.length>0&&(
            <div style={{ padding:"11px 13px",borderTop:`1px solid ${C.border}`,flexShrink:0 }}>
              {discount&&(
                <div style={{ display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:7,color:C.danger,fontWeight:600 }}>
                  <span>🏷 {discountDetail()}</span>
                  <span>-NT$ {discountAmount}</span>
                </div>
              )}
              <div style={{ display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:14,marginBottom:9 }}>
                <span>合計</span>
                <span style={{ color:C.accent,fontSize:18 }}>NT$ {total}</span>
              </div>
              <button onClick={()=>setShowSummary(true)} style={{ width:"100%",padding:"11px",background:C.accent,color:"#fff",border:"none",borderRadius:10,cursor:"pointer",fontSize:14,fontWeight:700 }}>確認點單 →</button>
            </div>
          )}
        </div>
      </div>

      {/* 清空確認 */}
      {showClearConfirm&&(
        <div onClick={()=>setShowClearConfirm(false)} style={{ position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200 }}>
          <div onClick={e=>e.stopPropagation()} style={{ background:"#fff",borderRadius:16,padding:"28px 24px",width:"min(300px,88vw)",textAlign:"center",boxShadow:"0 16px 48px rgba(0,0,0,0.22)" }}>
            <div style={{ fontSize:32,marginBottom:9 }}>🗑️</div>
            <div style={{ fontSize:15,fontWeight:700,marginBottom:5 }}>確定清空所有點單？</div>
            <div style={{ fontSize:12,color:C.muted,marginBottom:20 }}>共 {totalCups} 杯{totalBags>0?` · ${totalBags} 袋`:""}，此操作無法復原</div>
            <div style={{ display:"flex",gap:9 }}>
              <button onClick={()=>setShowClearConfirm(false)} style={{ flex:1,padding:"10px",background:"transparent",border:`1.5px solid ${C.border}`,borderRadius:9,cursor:"pointer",fontSize:13,fontWeight:600,color:C.muted }}>取消</button>
              <button onClick={clearAll} style={{ flex:1.2,padding:"10px",background:C.danger,color:"#fff",border:"none",borderRadius:9,cursor:"pointer",fontSize:13,fontWeight:700 }}>確定清空</button>
            </div>
          </div>
        </div>
      )}

      {/* 點單確認 */}
      {showSummary&&(
        <div onClick={()=>setShowSummary(false)} style={{ position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200 }}>
          <div onClick={e=>e.stopPropagation()} style={{ background:"#fff",borderRadius:16,padding:"24px",width:"min(440px,92vw)",maxHeight:"88vh",overflowY:"auto",boxShadow:"0 16px 48px rgba(0,0,0,0.22)" }}>
            <div style={{ fontSize:16,fontWeight:700,marginBottom:13,color:C.accentText }}>📋 點單確認</div>
            <div style={{ display:"flex",flexDirection:"column",gap:6,marginBottom:11 }}>
              {orders.map((o,i)=>(
                <div key={o.id} style={{ display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"8px 10px",background:C.bg,borderRadius:8 }}>
                  <div style={{ display:"flex",gap:6,flex:1 }}>
                    <span style={{ color:C.muted,fontSize:11,minWidth:15 }}>{i+1}.</span>
                    <div>
                      <div style={{ fontWeight:700,fontSize:13,display:"flex",alignItems:"center",gap:5 }}>
                        {o.item}
                        {o.qty>1&&<span style={{ background:C.accentLight,color:C.accentText,borderRadius:7,padding:"1px 6px",fontSize:11,fontWeight:700 }}>×{o.qty}</span>}
                      </div>
                      <div style={{ fontSize:11,color:C.muted,marginTop:1 }}>{orderSummaryLine(o)}</div>
                    </div>
                  </div>
                  <span style={{ fontWeight:700,fontSize:13,color:C.accentText,marginLeft:9,flexShrink:0 }}>NT$ {calcOrderAmount(o)}</span>
                </div>
              ))}
            </div>
            {discount&&(
              <div style={{ display:"flex",justifyContent:"space-between",padding:"8px 10px",background:C.dangerLight,borderRadius:8,border:`1px solid #EFC0C0`,marginBottom:8,fontSize:12,fontWeight:600,color:C.danger }}>
                <span>🏷 {discountDetail()}</span>
                <span>-NT$ {discountAmount}</span>
              </div>
            )}
            <div style={{ display:"flex",justifyContent:"space-between",borderTop:`2px solid ${C.border}`,paddingTop:10,fontWeight:700,fontSize:14,marginBottom:13 }}>
              <span>總計（{totalCups} 杯{totalBags>0?` · ${totalBags} 袋`:""}）</span>
              <span style={{ color:C.accent,fontSize:18 }}>NT$ {total}</span>
            </div>
            <div style={{ marginBottom:16 }}>
              <label style={{ display:"block",fontSize:11,fontWeight:700,color:C.muted,marginBottom:6,letterSpacing:1 }}>聯絡電話</label>
              <input type="tel" placeholder="請輸入電話號碼" value={phone} onChange={e=>setPhone(e.target.value)}
                style={{ width:"100%",padding:"9px 12px",border:`1.5px solid ${C.border}`,borderRadius:8,fontSize:14,background:C.bg,outline:"none",boxSizing:"border-box" }} />
            </div>
            <div style={{ display:"flex",gap:9 }}>
              <button onClick={()=>setShowSummary(false)} style={{ flex:1,padding:"10px",background:"transparent",border:`1.5px solid ${C.border}`,borderRadius:9,cursor:"pointer",fontSize:13,fontWeight:600,color:C.muted }}>繼續點餐</button>
              <button onClick={()=>{ setReceipt({orders:[...orders],total,totalCups,totalBags,phone,discount,discountAmount,discountDetail:discountDetail()}); setShowSummary(false); }}
                style={{ flex:1.5,padding:"10px",background:C.accent,color:"#fff",border:"none",borderRadius:9,cursor:"pointer",fontSize:14,fontWeight:700 }}>送出訂單</button>
            </div>
          </div>
        </div>
      )}

      {/* 結單畫面 */}
      {receipt&&(
        <div style={{ position:"fixed",inset:0,background:C.bg,display:"flex",flexDirection:"column",zIndex:300 }}>
          <div style={{ background:C.accent,color:"#fff",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0 }}>
            <span style={{ fontSize:17,fontWeight:700,letterSpacing:2 }}>🧃 點餐系統</span>
            <span style={{ fontSize:13,opacity:0.85 }}>訂單已送出</span>
          </div>
          <div style={{ flex:1,overflowY:"auto",padding:"20px 18px" }}>
            <div style={{ fontSize:15,fontWeight:700,color:C.accentText,marginBottom:14 }}>📋 訂單明細</div>
            {receipt.orders.filter(o=>o.category!=="袋子").length>0&&(
              <div style={{ marginBottom:16 }}>
                <div style={{ fontSize:11,fontWeight:700,color:C.muted,letterSpacing:1,marginBottom:8 }}>飲品</div>
                <div style={{ display:"flex",flexDirection:"column",gap:6 }}>
                  {receipt.orders.filter(o=>o.category!=="袋子").map((o,i)=>{
                    const amt=calcOrderAmount(o);
                    const sl=receiptSummaryLine(o);
                    return (
                      <div key={o.id} style={{ display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"10px 12px",background:C.surface,borderRadius:9,border:`1px solid ${C.border}` }}>
                        <div style={{ display:"flex",gap:8,flex:1 }}>
                          <span style={{ background:C.accent,color:"#fff",borderRadius:"50%",width:20,height:20,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0,marginTop:1 }}>{i+1}</span>
                          <div>
                            <div style={{ fontWeight:700,fontSize:14,display:"flex",alignItems:"center",gap:5 }}>
                              {o.item}
                              {o.qty>1&&<span style={{ background:C.accentLight,color:C.accentText,borderRadius:7,padding:"1px 6px",fontSize:11,fontWeight:700 }}>×{o.qty}</span>}
                            </div>
                            {sl&&<div style={{ fontSize:12,color:C.muted,marginTop:2 }}>{sl}</div>}
                          </div>
                        </div>
                        <span style={{ fontWeight:700,fontSize:14,color:C.accentText,marginLeft:10,flexShrink:0 }}>NT$ {amt}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
            {receipt.orders.filter(o=>o.category==="袋子").length>0&&(
              <div style={{ marginBottom:16 }}>
                <div style={{ fontSize:11,fontWeight:700,color:C.muted,letterSpacing:1,marginBottom:8 }}>袋子</div>
                <div style={{ display:"flex",flexDirection:"column",gap:6 }}>
                  {receipt.orders.filter(o=>o.category==="袋子").map(o=>(
                    <div key={o.id} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",background:C.surface,borderRadius:9,border:`1px solid ${C.border}` }}>
                      <span style={{ fontWeight:600,fontSize:14 }}>{o.item} ×{o.qty}</span>
                      <span style={{ fontWeight:700,fontSize:14,color:C.accentText }}>NT$ {o.unitTotal*o.qty}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
            {receipt.phone&&(
              <div style={{ padding:"10px 14px",background:C.surface,borderRadius:9,border:`1px solid ${C.border}`,marginBottom:16,fontSize:13 }}>
                <span style={{ color:C.muted }}>聯絡電話　</span>
                <span style={{ fontWeight:700 }}>{receipt.phone}</span>
              </div>
            )}
            {receipt.discount&&(
              <div style={{ display:"flex",justifyContent:"space-between",padding:"10px 14px",background:C.dangerLight,borderRadius:9,border:`1px solid #EFC0C0`,marginBottom:8,fontSize:13,fontWeight:600,color:C.danger }}>
                <span>🏷 {receipt.discountDetail || receipt.discount.name}</span>
                <span>-NT$ {receipt.discountAmount}</span>
              </div>
            )}
            <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",background:C.accentLight,borderRadius:10,border:`1.5px solid ${C.selectedBorder}` }}>
              <span style={{ fontWeight:700,fontSize:15,color:C.accentText }}>
                總計　{receipt.totalCups} 杯{receipt.totalBags>0?` · ${receipt.totalBags} 袋`:""}
              </span>
              <span style={{ fontWeight:700,fontSize:22,color:C.accent }}>NT$ {receipt.total}</span>
            </div>
          </div>
          <div style={{ padding:"14px 18px",borderTop:`1px solid ${C.border}`,display:"flex",gap:10,flexShrink:0,background:C.surface }}>
            <button onClick={()=>setReceipt(null)} style={{ flex:1,padding:"13px",background:"transparent",border:`1.5px solid ${C.border}`,borderRadius:10,cursor:"pointer",fontSize:14,fontWeight:700,color:C.muted }}>返回點單</button>
            <button onClick={()=>{ setReceipt(null); clearAll(); }} style={{ flex:1.5,padding:"13px",background:C.accent,color:"#fff",border:"none",borderRadius:10,cursor:"pointer",fontSize:14,fontWeight:700 }}>開新單</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<OrderApp />);
</script>
</body>
</html>
